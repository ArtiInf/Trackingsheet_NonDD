<div class="page-wrapper">
  <div class="login-container">

    <!-- Left Decorative & Info Panel -->
    <div class="left-panel">
      <div>
        <h1 class="welcome-heading">Welcome to Infinity IPS</h1>
        <p class="welcome-desc">
          TrackingSheet NonDD
        </p>
      </div>
      <div class="features-grid">
      </div>
    </div>
    <div class="right-panel">
      <div class="right-panel-wrapper">

        <div class="brand-logo-wrapper">
          <div class="brand-logo-mock">
            <div class="logo">
              <img src="http://23.111.175.186:81/images/logo-login.png" alt="Portal Logo" class="logo-img">
            </div>
          </div>
        </div>
        <div class="login-header">
          <h2>Sign In</h2>
          <p>Use your account credentials to continue</p>
        </div>

        <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">
          <!-- Username Block -->
          <div class="input-group">
            <label for="email">Username</label>
            <div class="input-field-container">
              <input id="email" type="email" formControlName="email" autocomplete="email" placeholder="Enter username">
              <span class="field-icon">
                <!-- User Silhouette Icon -->
                <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                  <path
                    d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z" />
                </svg>
              </span>
            </div>
          </div>
          <!-- Password Block -->
          <div class="input-group">
            <label for="password">Password</label>
            <div class="input-field-container">
              <input id="password" type="password" formControlName="password" autocomplete="current-password"
                placeholder="Enter password">
              <span class="field-icon">
                <!-- Lock Icon -->
                <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                  <path
                    d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z" />
                </svg>
              </span>
            </div>
          </div>

          <!-- Extra Controls Panel -->
          <div class="form-options">
          </div>
          <div class="form-actions"></div>
          <!-- Control Trigger -->
          <button type="submit" [disabled]="!loginForm.valid">
            Sign In
          </button>
          <!-- Security Status Text -->
          <div class="security-footer">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor">
              <path
                d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z" />
            </svg>
            Protected internal workspace
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
