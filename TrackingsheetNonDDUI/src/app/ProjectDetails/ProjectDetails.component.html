<div class="users-container">
  <div class="filter-card">

    <div class="filter-header">
      <span class="material-icons text-icon">analytics</span>
      <h3>Project Tracking</h3>
    </div>

    <div class="filter-form-grid">

        <div class="form-group">
    <label for="projectName">PROJECT NAME <span class="text-danger">*</span></label>
    <div class="input-wrapper">
      <select id="projectName" class="form-control" [(ngModel)]="selectedProjectId" size="1" 
        onfocus="this.size=6;" 
        onblur="this.size=1;">
        
    <option [value]="0">Select Project</option>
    
    <option *ngFor="let proj of projectsList" 
            [value]="proj.projectId" 
            onclick="document.getElementById('projectName').blur();">
        {{ proj.projectName }}
    </option>
</select>
    </div>
  </div>

      <div class="form-group">
        <label for="fromDate">FROM DATE <span class="text-danger">*</span></label>
        <input type="date" id="fromDate" class="form-control" [(ngModel)]="fromDate" [max]="toDate || today">
      </div>

      <div class="form-group">
        <label for="toDate">TO DATE <span class="text-danger">*</span></label>
        <input type="date" id="toDate" class="form-control" [(ngModel)]="toDate" [max]="today" [min]="fromDate">
      </div>
    </div>

    <div class="center-btn-container">
      <button class="proceed-btn" (click)="navigateToTrackingSheet()">
        <span>Proceed</span>
        <span class="material-icons btn-icon">arrow_forward</span>
      </button>
    </div>

  </div>
</div>
