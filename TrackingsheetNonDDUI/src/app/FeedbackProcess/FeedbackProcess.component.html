<div class="feedback-popup-container">
    <div class="popup-header">
        <h3>Process Feedback</h3>
    </div>

    <hr>

    <div class="form-row columns-3">
        <div class="form-group">
            <label>Project :</label>
            <input type="text" [(ngModel)]="projectName" readonly>
        </div>
        <div class="form-group">
            <label>Order Date :</label>
            <input type="text" [(ngModel)]="orderDate" readonly>
        </div>
        <div class="form-group">
            <label>Order No :</label>
            <input type="text" [(ngModel)]="orderNumber" readonly>
        </div>
    </div>

    <div class="form-row columns-3">
        <div class="form-group">
            <label>Process :</label>
            <input type="text" [(ngModel)]="previousProcessName" readonly>
        </div>
        <div class="form-group">
            <label>Error Done By :</label>
            <input type="text" [(ngModel)]="pqa" readonly>
        </div>
        <div class="form-group">
            <label>Feedback Given By :</label>
            <input type="text" [(ngModel)]="empcode" readonly>
        </div>
    </div>

    <div class="form-row columns-5">
        <div class="form-group">
            <label>Error Type :</label>
            <select [(ngModel)]="errorType">
                <option value="">Select</option>
                <option value="Technical">Technical</option>
                <option value="Process Deviation">Process Deviation</option>
            </select>
        </div>
        <div class="form-group">
            <label>Critical/Non-Critical :</label>
            <select [(ngModel)]="criticality">
                <option value="">Select</option>
                <option value="Critical">Critical</option>
                <option value="Non-Critical">Non-Critical</option>
            </select>
        </div>
        <div class="form-group">
            <label>FeedBack Type :</label>
            <select [(ngModel)]="feedbackType">
                <option value="">Select</option>
                <option value="Internal">Internal</option>
                <option value="Client">Client</option>
            </select>
        </div>
        <div class="form-group">
            <label>Error Field :</label>
            <input type="text" [(ngModel)]="errorField">
        </div>
        <div class="form-group">
            <label>Feedback Received Date :</label>
            <input type="date" [(ngModel)]="feedbackReceivedDate" [max]="maxDate">
        </div>
    </div>

    <div class="form-group full-width">
        <label>Error :</label>
        <textarea rows="2" class="feedback-textarea" style="resize: none;"  [(ngModel)]="errorDescription"></textarea>
    </div>

    <div class="form-group full-width">
        <label>ShouldBe :</label>
        <textarea rows="2" class="feedback-textarea" style="resize: none;"  [(ngModel)]="shouldBe"></textarea>
    </div>

    <div class="form-group full-width">
        <label>Remark :</label>
        <textarea rows="2" class="feedback-textarea" style="resize: none;"  [(ngModel)]="remark"></textarea>
    </div>

    <div class="feedback-actions">
        <button class="btn-action btn-add" (click)="submitFeedback()">ADD</button>
    </div>
</div>
